<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="theme-color" content="#a8507a"><title>Controle de Despesas</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Despesas"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>*{box-sizing:border-box}
:root{--bg:#fbf6f8;--card:#fff;--ink:#4a2a40;--mut:#9a7a8c;--line:#f1e3ea;--rosa:#c2577f;--rosa2:#e08aa8;--ameixa:#6b3a5e;--verm:#d9435e;--lar:#e8892f;--verde:#3fa37a;--sh:0 6px 22px rgba(194,87,127,.10)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
body{text-transform:uppercase}
input,select,textarea,button{font-family:inherit;text-transform:uppercase;color:inherit}
.nocaps,.nocaps input,input.nocaps{text-transform:none!important}
header.top{background:linear-gradient(110deg,#6b3a5e,#a8507a 55%,#e08aa8);color:#fff;padding:14px 22px 0;border-radius:0 0 26px 26px;box-shadow:0 8px 26px rgba(107,58,94,.25)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hrow h1{margin:0;font-size:21px;letter-spacing:.5px;font-weight:700}
.hrow .sub{opacity:.85;font-size:11px}
.sync{margin-left:auto;font-size:11px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav.menu{display:flex;gap:6px;padding:12px 0 14px;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu button{border:0;background:rgba(255,255,255,.16);color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
nav.menu button.on{background:#fff;color:var(--ameixa)}
main{padding:16px 22px 90px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--ameixa);letter-spacing:.4px}
.btn{border:0;border-radius:999px;padding:8px 16px;background:linear-gradient(110deg,#c2577f,#e08aa8);color:#fff;font-weight:600;font-size:12px;cursor:pointer;box-shadow:0 3px 10px rgba(194,87,127,.25)}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:#f7e8ef;color:var(--rosa);box-shadow:none}
.btn.red{background:linear-gradient(110deg,#c9344f,#e86a80)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.big{padding:14px 22px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f label{display:block;font-size:10px;color:var(--mut);margin:0 0 3px 4px;font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;font-size:12px;min-width:110px}
.f textarea{width:100%;min-height:110px;text-transform:none}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;border-top:4px solid var(--rosa2)}
.kpi .l{font-size:10px;color:var(--mut);font-weight:700}
.kpi .v{font-size:19px;font-weight:700;margin-top:5px}
.kpi .d{font-size:10px;margin-top:3px}
.up{color:var(--verm)}.down{color:var(--verde)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
svg text{font-family:inherit}
.legend{display:flex;flex-direction:column;gap:5px;font-size:11px;max-height:260px;overflow:auto}
.legend div{display:flex;align-items:center;gap:7px;cursor:pointer;padding:2px 6px;border-radius:8px}
.legend div:hover{background:#fbeff4}
.legend i{width:11px;height:11px;border-radius:4px;flex:none}
.legend b{margin-left:auto;font-weight:600}
#tip{position:fixed;pointer-events:none;background:#4a2a40;color:#fff;font-size:11px;padding:6px 10px;border-radius:10px;opacity:0;transition:opacity .1s;z-index:99;white-space:nowrap}
/* tabela */
table.lanc{width:100%;min-width:1120px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:11px}
table.lanc th{background:#f8edf2;color:var(--ameixa);font-weight:700;text-align:left;padding:6px 4px;font-size:10px;position:sticky;top:0;z-index:1}
table.lanc th[data-sort]{cursor:pointer;user-select:none}
table.lanc th[data-sort]:hover{color:var(--rosa)}
table.lanc tr.fcol th{top:27px;background:#fdf5f8;padding:3px 2px;border-radius:0!important}
table.lanc tr.fcol input{background:#fff;border:1px solid var(--line);font-size:10px;padding:3px 4px}
table.lanc th:first-child{border-radius:10px 0 0 10px}table.lanc th:last-child{border-radius:0 10px 10px 0}
table.lanc td{padding:2px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lanc input,table.lanc select{width:100%;border:1px solid transparent;background:transparent;font-size:11px;padding:4px 3px;border-radius:7px;min-width:0}
table.lanc select{-webkit-appearance:none;appearance:none;background-image:none;padding-right:2px;cursor:pointer}
table.lanc input:hover,table.lanc select:hover{border-color:var(--line)}
table.lanc input:focus,table.lanc select:focus{border-color:var(--rosa2);background:#fff;outline:0}
table.lanc input[type=date]{padding:4px 1px;font-size:10.5px}
table.lanc td.num input{text-align:right;font-weight:600}
table.lanc tr.pago td{opacity:.62}
table.lanc tr.atras td .st{color:var(--verm);font-weight:700}
table.lanc tr.auto td:nth-child(2) input{font-style:italic}
.del{border:0;background:none;color:#c98aa5;cursor:pointer;font-size:14px;padding:0 4px}
.del:hover{color:var(--verm)}
.tw{max-height:62vh;overflow:auto}
.tot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tot .big{font-size:22px;font-weight:800;color:var(--ameixa);background:#fbeff4;padding:10px 18px;border-radius:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:11px;cursor:pointer;font-weight:600}
.chip b{color:var(--rosa)}
.chip.on{background:var(--rosa);color:#fff;border-color:var(--rosa)}.chip.on b{color:#fff}
/* avisos */
.av{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;margin-bottom:8px;font-size:12px;font-weight:600}
.av.r{background:#fde6ea;color:#a3243c}.av.o{background:#fff0e0;color:#a5560f}
.av .sp{flex:1}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(74,42,64,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{background:#fff;border-radius:22px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(74,42,64,.3);max-height:92vh;overflow:auto}
.modal.wide{max-width:1100px}
.modal h2{margin:0 0 10px;font-size:15px;color:var(--ameixa)}
.modal .msg{font-size:13px;line-height:1.45;margin-bottom:14px;text-transform:none}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#c2577f,#e08aa8);color:#fff;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 8px 22px rgba(194,87,127,.45);z-index:40}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qgrid .f input,.qgrid .f select{width:100%}
.wel{text-align:center;padding:30px 18px}
.wel h2{color:var(--ameixa);margin:0 0 6px}
.wel p{color:var(--mut);margin:0 0 18px;font-size:12px}
.wel .row{justify-content:center}
.pv{font-size:11px;width:100%;border-collapse:collapse;table-layout:fixed}
.pv th{background:#f8edf2;text-align:left;padding:5px;font-size:10px;position:sticky;top:0}
.pv td{padding:3px 5px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv select{font-size:10.5px;width:100%;border:1px solid var(--line);border-radius:6px}
.pv tr.dup td{color:#b9a0ad}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9.5px;font-weight:700;background:#f7e8ef;color:var(--rosa)}
.tag.dup{background:#eee;color:#888}.tag.new{background:#e2f5ec;color:#2b8a5f}.tag.upd{background:#e6eefc;color:#3559a8}.tag.delt{background:#fde6ea;color:#a3243c}
.redbox{background:#fff3f5;border:2px solid #f1a5b4;border-radius:16px;padding:10px 14px;margin-top:12px}
.redbox h4{margin:0 0 6px;color:#a3243c;font-size:12px}
.muted{color:var(--mut);font-size:11px;text-transform:none}
.sumbox{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.catrow{display:grid;grid-template-columns:28px 180px 1fr 40px;gap:8px;align-items:center;margin-bottom:6px}
.catrow input{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;width:100%}
.cardbtn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;cursor:pointer;font-weight:700;font-size:12px;color:var(--ameixa)}
.cardbtn.on{border-color:var(--rosa);background:#fbeff4}
.step{font-size:11px;font-weight:800;color:var(--rosa);margin:14px 0 6px}
.hide{display:none!important}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
 header.top{padding:12px 14px 0;border-radius:0 0 20px 20px}
 .hrow h1{font-size:17px}
 main{padding:12px 10px 90px}
 .kpis{grid-template-columns:1fr 1fr;gap:8px}
 .kpi .v{font-size:16px}
 .grid2{grid-template-columns:1fr}
 .card{padding:12px;border-radius:18px}
 .tw{max-height:none}
 table.lanc thead{display:none}
 table.lanc,table.lanc tbody{display:block;min-width:0}
 table.lanc tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
 table.lanc td{border:0;padding:0}
 table.lanc td:before{content:attr(data-l);display:block;font-size:9px;color:var(--mut);font-weight:700;padding-left:3px}
 table.lanc td.c-desc{grid-column:1/3}
 table.lanc td.c-obs{grid-column:1/3}
 table.lanc input,table.lanc select{border-color:var(--line);font-size:12px}
 .qgrid{grid-template-columns:1fr}
 .av{flex-wrap:wrap;font-size:11px}.av .sp{flex:1 1 70%}
 .catrow{grid-template-columns:24px 1fr 34px}.catrow .kw{grid-column:1/4}
 .f input,.f select{min-width:0}
 .row>.f{flex:1 1 44%}
}
